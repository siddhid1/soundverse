name: soundverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soundverse
      POSTGRES_PASSWORD: soundverse
      POSTGRES_DB: soundverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store. pgsty/silo is a drop-in MinIO fork (same S3 API,
  # same MINIO_* vars, ports and health path): minio/* images are archived
  # upstream and no longer pull. Pin a digest for production use.
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # pgsty/mc is the maintained mc build (minio/mc is archived upstream).
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb -p local/soundverse-audio &&
             echo bucket-ready"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Local-dev convenience: allow http + loopback/private webhook targets so
    # the quickstart receiver works. NEVER enable in production (https + public
    # IPs are enforced when this is false).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse
      S3_ENDPOINT: http://minio:9000
      # Browsers/curl hit the host-mapped port; the worker/SDK traffic stays
      # on the internal service name above. Presigned URLs are minted against
      # this public host (signing is local; no extra network hop).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: soundverse-audio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SESSION_SECRET: dev-session-secret-change-me-32chars
      WEBHOOK_CRYPT_KEY: dev-webhook-crypt-key-change-me!!
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"
      PROVIDER: mock
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    # Compiled output only: the runtime image omits devDependencies (tsx).
    command: sh -c "node dist/db/migrate.js && node dist/server.js"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: soundverse-audio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      PROVIDER: mock
      SESSION_SECRET: dev-session-secret-change-me-32chars
      WEBHOOK_CRYPT_KEY: dev-webhook-crypt-key-change-me!!
    command: sh -c "node dist/worker.js"

  webhook-dispatcher:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://soundverse:soundverse@postgres:5432/soundverse
      SESSION_SECRET: dev-session-secret-change-me-32chars
      WEBHOOK_CRYPT_KEY: dev-webhook-crypt-key-change-me!!
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"
    command: sh -c "node dist/webhooks.js"

volumes:
  pgdata:
  miniodata:
